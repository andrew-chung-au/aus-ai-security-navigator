services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aus-ai-security-postgres
    environment:
      POSTGRES_DB: aus_ai_security_navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d aus_ai_security_navigator",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aus_ai_security_navigator
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      sh -c "
      uv run python src/db_init.py &&
      uv run python src/db_load_chunks.py &&
      uv run python src/db_build_embeddings.py
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aus_ai_security_navigator
    ports:
      - "8501:8501"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache: