services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aus-ai-security-postgres
    environment:
      POSTGRES_DB: aus_ai_security_navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: